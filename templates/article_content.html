{% extends "base.html" %}

{% block title %}{{ article.title }}{% endblock %}

{% block content %}
    <article class="bg-white rounded-lg shadow-sm p-8 border border-gray-200">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-4">{{ article.title }}</h1>
            <div class="flex items-center gap-4 text-sm text-gray-500 font-mono">
                <span>
                    from <span class="text-blue-500">{{ article.feed.title }}</span>
                </span>
                <span>at {{ article.time_published }}</span>
                <form action="/articles/{{ article.id }}/favorite" method="post">
                    <button type="submit" class="transition
                        {% if article.is_favorite %}
                            text-green-600 hover:text-green-700
                        {% else %}
                            text-gray-500 hover:text-blue-600
                        {% endif %}">
                        {% if article.is_favorite %}
                            in favorites
                        {% else %}
                            add to favorites
                        {% endif %}
                    </button>
                </form>
            </div>
        </header>
        
        <div class="prose max-w-none">
            {{ article.content | safe }}
        </div>
        
        <footer class="mt-8 pt-6 border-t border-gray-200">
            <a href="{{ article.link }}" target="_blank" class="text-blue-500 hover:text-blue-600 font-mono text-sm transition">
                read original >>
            </a>
        </footer>
    </article>
{% endblock %}
