{% extends "base.html" %}

{% block title %}RSS Reader - Home{% endblock %}

{% block content %}
    <div class="bg-white rounded-lg shadow-md p-12 text-center">
        <h1 class="text-4xl font-bold text-gray-800 mb-4">Welcome to RSS Reader</h1>
        <p class="text-gray-600 text-lg mb-8">
            Stay updated with your favorite blogs and news sources.
        </p>
        <div class="flex gap-4 justify-center">
            <a href="/feeds" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg font-medium transition">
                View Feeds
            </a>
            <a href="/articles" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-6 py-3 rounded-lg font-medium transition">
                Browse Articles
            </a>
        </div>
    </div>
{% endblock %}
