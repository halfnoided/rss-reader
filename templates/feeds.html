{% extends "base.html" %}

{% block content %}

<h1 class="text-3xl font-bold text-gray-800 mb-8">
    Feeds

    <form action="/feeds/refresh" method="post" class="inline ml-4">
        <button type="submit" class="text-blue-500 hover:text-blue-600 font-mono text-sm transition">
            refresh all
        </button>
    </form>
</h1>

<div class="bg-white rounded-lg shadow-sm p-6 mb-6 border border-gray-200">
    <h2 class="text-lg font-semibold text-gray-800 mb-4">Add New Feed</h2>
    <form action="/feeds" method="post" class="flex gap-4 items-end">
        <div class="flex-1">
            <label for="feed_url" class="block text-sm font-medium text-gray-700 mb-1">Website or RSS URL</label>
            <input type="text" id="feed_url" name="feed_url" required 
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
        <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-md font-medium transition">
            Add Feed
        </button>
    </form>
</div>

{% if feeds %}
    <div class="space-y-4">
        {% for feed in feeds %}
            <div class="bg-white rounded-lg shadow-sm p-6 hover:shadow-md transition border border-gray-200">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-xl font-semibold text-gray-800">{{ feed.title }}</h2>
                    </div>
                    <div class="flex items-center gap-4">
                        <a href="/feeds/{{ feed.id }}/articles" class="text-blue-500 hover:text-blue-600 font-mono text-sm transition">
                            articles >
                        </a>
                        <a href="{{ feed.url }}" target="_blank" class="text-blue-500 hover:text-blue-600 font-mono text-sm transition">
                            source link >
                        </a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% else %}
    <div class="bg-white rounded-lg shadow-sm p-8 text-center border border-gray-200">
        <p class="text-gray-600">No feeds yet.</p>
    </div>
{% endif %}

{% endblock %}
