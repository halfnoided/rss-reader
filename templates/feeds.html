{% extends "base.html" %}

{% block title %}Feeds{% endblock %}

{% block content %}
    <h1 class="text-3xl font-bold text-gray-800 mb-8">
        Feeds
        <form action="/feeds/refresh" method="post" class="inline ml-4">
            <button type="submit" class="text-blue-500 hover:text-blue-600 font-mono text-sm transition">
                refresh all
            </button>
        </form>
    </h1>
    
    {% if feeds %}
        <div class="space-y-4">
        {% for feed in feeds %}
            <div class="bg-white rounded-lg shadow-sm p-6 hover:shadow-md transition border border-gray-200">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-xl font-semibold text-gray-800">{{ feed.title }}</h2>
                    </div>
                    <div class="flex items-center gap-4">
                        <a href="/feeds/{{ feed.id }}/articles" class="text-blue-500 hover:text-blue-600 font-mono text-sm transition">
                            articles >
                        </a>
                        <a href="{{ feed.url }}" target="_blank" class="text-blue-500 hover:text-blue-600 font-mono text-sm transition">
                            source link >
                        </a>
                    </div>
                </div>
            </div>
        {% endfor %}
        </div>
    {% else %}
        <div class="bg-white rounded-lg shadow-sm p-8 text-center border border-gray-200">
            <p class="text-gray-600">No feeds yet.</p>
        </div>
    {% endif %}
{% endblock %}
