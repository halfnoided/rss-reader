# basic workflow provides builder,
# pip dependency installer, ruff linter

name: basic workflow

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: repo checkout 
      uses: actions/checkout@v7

    - name: set python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: install pip dependencies
      run: |
        python -m pip install --upgrade pip 
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: lint using ruff
      run: ruff check . --output-format=github
      
      # In some frameworks, ruff cannot detect imports properly,
      # therefore it forces to remove some that are actually in use
      continue-on-error: true
    
    - name: type checking using mypy
      run: mypy .